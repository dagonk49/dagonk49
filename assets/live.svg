<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 106 24" width="106" height="24" role="img" aria-label="En ligne">
<title>En ligne</title>
<style>
.r{transform-box:fill-box;transform-origin:center;animation:r 1.8s ease-out infinite}
