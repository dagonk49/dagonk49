</style>
<rect x=".5" y=".5" width="105" height="23" rx="12" fill="#0f2a1a" stroke="#238636"/>
<g class="a"><circle class="r" cx="14" cy="12" r="4" fill="#3fb950"/></g>
<circle cx="14" cy="12" r="4" fill="#3fb950"/>
