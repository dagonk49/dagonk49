<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 22" width="900" height="22" role="presentation">
<style>
.p{animation:run 5s linear infinite}
.p2{animation:run 5s linear infinite;animation-delay:-2.5s}
@keyframes run{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(840px);opacity:0}}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}.pkt{display:none}}
</style>
<defs><filter id="g" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#8b949e" stop-opacity="0"/><stop offset=".12" stop-color="#8b949e" stop-opacity=".45"/><stop offset=".88" stop-color="#8b949e" stop-opacity=".45"/><stop offset="1" stop-color="#8b949e" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="10" width="900" height="2" rx="1" fill="url(#l)"/>
<g class="a">
<g class="p"><rect x="18" y="7" width="22" height="8" rx="4" fill="#38bdf8" filter="url(#g)" opacity=".8"/><rect x="18" y="8" width="22" height="6" rx="3" fill="#38bdf8"/></g>
<g class="p2"><rect x="18" y="8" width="14" height="6" rx="3" fill="#3fb950" opacity=".85"/></g>
</g>
</svg>