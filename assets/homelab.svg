.bar{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.8s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.a,.a *{animation:none!important}.pkt{display:none}}</style>
